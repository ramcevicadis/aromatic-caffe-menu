            transition: all 0.2s;

        .back-button:active, .info-button:active, .menu-button:active, .wifi-button:active {

            right: 0;

        .menu-button-home span {

            right: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s;
        }

        .modal-content.full-width {
            max-width: 100%;
            width: 100%;
            border-radius: 0;
            padding: 20px;
            max-height: 100vh;
        }

        /* On desktop, keep normal modal size */
        @media (min-width: 768px) {
            .modal-content.full-width {
                max-width: 600px;
                width: 90%;
                border-radius: 20px;
                padding: 30px;
                max-height: 80vh;
            }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;

            border: none;

            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;

            font-size: 14px;

        .edit-button, .delete-button {

        }

        .edit-button {

        .delete-button {

            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #666;
        }

            const handleBack = () => {
                if (screen === 'items') {
                    setScreen('categories');
                    setSelectedCategory(null);
                } else if (screen === 'categories') {
                    setScreen('home');
                } else if (screen === 'admin-dashboard') {
                    setScreen('home');
                    setIsAdmin(false);
                }
            };

            return (
                <div className="container">
                    {screen === 'home' && (
                        <>
                            <div className="header">
                                <button className="menu-button" onClick={() => setScreen('admin-login')}>☰</button>
                                <div className="logo-container"></div>
                                <button className="wifi-button" onClick={() => setShowWifi(true)}>
                                    <img src="images/wifi_icon.png" alt="WiFi" style={{width: '24px'}} />
                                </button>
                            </div>
                            <div className="home-screen">
                                <div className="background-sketch"></div>
                                <img src="images/Logo_Aromatic.jpg" alt="Aromatic Caffe" className="home-logo" />
                                <button className="menu-button-home" onClick={() => setScreen('categories')}>
                                    <span>{t.menu}</span>
                                    <img src="images/coffee.png" alt="Menu" />
                                </button>
                                <div className="language-selector">
                                    <button 
                                        className={`language-button ${language === 'sr' ? 'active' : ''}`}
                                        onClick={() => setLanguage('sr')}
                                    >
                                        <span className="flag">🇷🇸</span>
                                        <span>Srpski</span>
                                    </button>
                                    <button 
                                        className={`language-button ${language === 'en' ? 'active' : ''}`}
                                        onClick={() => setLanguage('en')}
                                    >
                                        <span className="flag">🇬🇧</span>
                                        <span>English</span>
                                    </button>
                                </div>
                                <div className="footer">
                                    <a href="https://www.instagram.com/aromatic_caffe?igsh=MWQwMXBuYnJpODJtZA==" target="_blank" rel="noopener noreferrer">
                                        <img src="images/insta.png" alt="Instagram" className="social-icon" style={{cursor: 'pointer'}} />
                                    </a>
                                    <div className="website">www.aromaticcaffe.rs</div>
                                </div>
                            </div>
                        </>
                    )}

                    {screen === 'categories' && (
                        <>
                            <div className="header">
                                <button className="back-button" onClick={handleBack}>←</button>
                                <div className="logo-container">
                                    <img src="images/Logo_Aromatic.jpg" alt="Logo" className="logo" />
                                </div>
                                <button className="info-button" onClick={() => setShowInfo(true)}>ⓘ</button>
                            </div>
                            <div className="categories-grid">
                                {currentCategories.map(category => (
                                    <button 
                                        key={category.id}
                                        className="category-card"
                                        onClick={() => handleCategoryClick(category.id)}
                                    >
                                        <span>{category.name}</span>
                                        <img src={`images/${category.icon}`} alt={category.name} className="category-icon" />
                                    </button>
                                ))}
                                <button className="category-card" onClick={() => setShowAllergens(true)}>
                                    <span>{t.allergens}</span>
                                    <span style={{fontSize: '40px'}}>📋</span>
                                </button>
                            </div>
                        </>
                    )}

                    {screen === 'items' && selectedCategory && (
                        <>
                            <div className="header">
                                <button className="back-button" onClick={handleBack}>←</button>
                                <div className="logo-container">
                                    <img src="images/Logo_Aromatic.jpg" alt="Logo" className="logo" />
                                </div>
                                <button className="info-button" onClick={() => setShowInfo(true)}>ⓘ</button>
                            </div>
                            <div className="items-list">
                                {items[selectedCategory]?.map(item => (
                                    <div key={item.id} className="item-card">
                                        <span className="item-name">{item.name[language]}</span>
                                        <span className="item-price">{item.price}</span>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}

                    {screen === 'admin-login' && (
                        <>
                            <div className="header">
                                <button className="back-button" onClick={() => setScreen('home')}>←</button>
                                <div className="logo-container">
                                    <img src="images/Logo_Aromatic.jpg" alt="Logo" className="logo" />
                                </div>
                                <div style={{width: '40px'}}></div>
                            </div>
                            <AdminLogin onLogin={() => { setIsAdmin(true); setScreen('admin-dashboard'); }} />
                        </>
                    )}

                    {screen === 'admin-dashboard' && (
                        <>
                            <div className="header">
                                <button className="back-button" onClick={handleBack}>←</button>
                                <div className="logo-container">
                                    <img src="images/Logo_Aromatic.jpg" alt="Logo" className="logo" />
                                </div>
                                <div style={{width: '40px'}}></div>
                            </div>
                            <AdminDashboard 
                                items={items}
                                categories={categories}
                                onBack={handleBack}
                                onUpdateItems={setItems}
                            />
                        </>
                    )}

                    {/* Modals */}
                    {showAllergens && (
                        <div className="modal-overlay" onClick={() => setShowAllergens(false)}>
                            <div className="modal-content" onClick={e => e.stopPropagation()}>
                                <button className="modal-close" onClick={() => setShowAllergens(false)}>✕</button>
                                <h2 className="modal-title">{t.allergensTitle}</h2>
                                <p style={{marginBottom: '20px', lineHeight: '1.6', fontSize: '16px', fontWeight: '500', color: '#1a1a1a'}}>{t.allergensText}</p>
                                <ul className="allergen-list">
                                    {allergens[language].map((allergen, index) => (
                                        <li key={index} className="allergen-item">
                                            <span style={{fontSize: '24px'}}>{allergen.icon}</span>
                                            <span className="allergen-name">{allergen.name}</span>
                                        </li>
                                    ))}
                                </ul>
                                <p className="allergen-note">{t.allergensNote}</p>
                            </div>
                        </div>
                    )}

                    {showWifi && (
                        <div className="modal-overlay" onClick={() => setShowWifi(false)}>
                            <div className="modal-content wifi-modal-content" onClick={e => e.stopPropagation()}>
                                <button className="modal-close" onClick={() => setShowWifi(false)}>✕</button>
                                <img src="images/wifi_icon.png" alt="WiFi" className="wifi-icon-large" />
                                <div className="wifi-info">
                                    <div className="wifi-label">{t.wifiNetwork}</div>
                                    <div className="wifi-value">aromaticcaffe</div>
                                </div>
                                <div className="wifi-info">
                                    <div className="wifi-label">{t.wifiPassword}</div>
                                    <div className="wifi-value">aromatic2025</div>
                                </div>
                                <div className="qr-code">
                                    <img src="images/wifi_qr.png" alt="WiFi QR Code" style={{width: '100%', height: '100%', objectFit: 'contain'}} />
                                </div>
                            </div>
                        </div>
                    )}

                    {showInfo && (
                        <div className="modal-overlay" onClick={() => setShowInfo(false)}>
                            <div className="modal-content full-width info-modal-content" onClick={e => e.stopPropagation()}>
                                <button className="modal-close" onClick={() => setShowInfo(false)}>✕</button>
                                <h2 className="info-title">{t.aboutTitle}</h2>
                                <p className="info-text">{t.aboutText1}</p>
                                <p className="info-text">{t.aboutText2}</p>
                                <img src="images/slika_han.png" alt="Amir-Agin Han" className="info-image" />
                                <p className="info-source">{t.source}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AdminLogin({ onLogin }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                try {
                    // Firebase Authentication
                    await auth.signInWithEmailAndPassword(email, password);
                    onLogin();
                    setLoading(false);
                } catch (error) {
                    console.error('Login error:', error);
                    if (error.code === 'auth/user-not-found') {
                        setError('Korisnik ne postoji');
                    } else if (error.code === 'auth/wrong-password') {
                        setError('Pogrešna lozinka');
                    } else if (error.code === 'auth/invalid-email') {
                        setError('Neispravan email format');
                    } else {
                        setError('Greška pri prijavljivanju. Pokušajte ponovo.');
                    }
                    setLoading(false);
                }
            };

            return (
                <div className="admin-login">
                    <h1 className="admin-title">Admin Panel</h1>
                    {error && <div className="error-message">{error}</div>}
                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label className="form-label">Email</label>
                            <input 
                                type="email"
                                className="form-input"
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                required
                            />
                        </div>
                        <div className="form-group">
                            <label className="form-label">Lozinka</label>
                            <input 
                                type="password"
                                className="form-input"
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                required
                            />
                        </div>
                        <button type="submit" className="submit-button" disabled={loading}>
                            {loading ? 'Prijava...' : 'Prijavi se'}
                        </button>
                    </form>
                </div>
            );
        }

        function AdminDashboard({ items, categories, onBack, onUpdateItems }) {
            const [selectedCategory, setSelectedCategory] = useState('topli-napici');
            const [editingItem, setEditingItem] = useState(null);
            const [showAddModal, setShowAddModal] = useState(false);
            const [newItem, setNewItem] = useState({ name: { sr: '', en: '' }, price: 0 });

            const handleDeleteItem = (itemId) => {
                if (confirm('Da li ste sigurni da želite obrisati ovaj artikal?')) {
                    const newItems = { ...items };
                    newItems[selectedCategory] = newItems[selectedCategory].filter(item => item.id !== itemId);
                    onUpdateItems(newItems);
                }
            };

            const handleEditItem = (item) => {
                setEditingItem(item);
            };

            const handleSaveEdit = () => {
                const newItems = { ...items };
                const index = newItems[selectedCategory].findIndex(item => item.id === editingItem.id);
                newItems[selectedCategory][index] = editingItem;
                onUpdateItems(newItems);
                setEditingItem(null);
            };

            const handleAddItem = () => {
                if (!newItem.name.sr || !newItem.name.en || !newItem.price) {
                    alert('Molimo popunite sva polja!');
                    return;
                }
                
                const newItems = { ...items };
                const newId = Math.max(...newItems[selectedCategory].map(item => item.id), 0) + 1;
                
                newItems[selectedCategory].push({
                    id: newId,
                    name: { sr: newItem.name.sr, en: newItem.name.en },
                    price: parseInt(newItem.price)
                });
                
                onUpdateItems(newItems);
                setNewItem({ name: { sr: '', en: '' }, price: 0 });
                setShowAddModal(false);
            };

            return (
                <div className="admin-dashboard">
                    <h1 style={{fontSize: '24px', fontWeight: '600', marginBottom: '30px', textAlign: 'center'}}>Admin Panel</h1>

                    <div className="form-group">
                        <label className="form-label">Kategorija</label>
                        <select 
                            className="form-input"
                            value={selectedCategory}
                            onChange={(e) => setSelectedCategory(e.target.value)}
                        >
                            {categories.sr.map(cat => (
                                <option key={cat.id} value={cat.id}>{cat.name}</option>
                            ))}
                        </select>
                    </div>

                    <button className="add-item-button" onClick={() => setShowAddModal(true)}>
                        + Dodaj Artikal
                    </button>

                    <div>
                        {items[selectedCategory]?.map(item => (
                            <div key={item.id} className="admin-item-card">
                                {editingItem?.id === item.id ? (
                                    <div>
                                        <input 
                                            className="form-input"
                                            value={editingItem.name.sr}
                                            onChange={(e) => setEditingItem({
                                                ...editingItem,
                                                name: { ...editingItem.name, sr: e.target.value }
                                            })}
                                            placeholder="Naziv (SR)"
                                            style={{marginBottom: '10px'}}
                                        />
                                        <input 
                                            className="form-input"
                                            value={editingItem.name.en}
                                            onChange={(e) => setEditingItem({
                                                ...editingItem,
                                                name: { ...editingItem.name, en: e.target.value }
                                            })}
                                            placeholder="Name (EN)"
                                            style={{marginBottom: '10px'}}
                                        />
                                        <input 
                                            className="form-input"
                                            type="number"
                                            value={editingItem.price}
                                            onChange={(e) => setEditingItem({
                                                ...editingItem,
                                                price: parseInt(e.target.value)
                                            })}
                                            placeholder="Cena"
                                            style={{marginBottom: '10px'}}
                                        />
                                        <div style={{display: 'flex', gap: '10px'}}>
                                            <button className="edit-button" onClick={handleSaveEdit}>Sačuvaj</button>
                                            <button className="delete-button" onClick={() => setEditingItem(null)}>Otkaži</button>
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        <div className="admin-item-header">
                                            <div>
                                                <div style={{fontWeight: '600', marginBottom: '5px'}}>{item.name.sr}</div>
                                                <div style={{fontSize: '14px', color: '#666'}}>{item.name.en}</div>
                                            </div>
                                            <div style={{fontSize: '18px', fontWeight: '600', color: '#dc143c'}}>
                                                {item.price} RSD
                                            </div>
                                        </div>
                                        <div className="admin-item-actions">
                                            <button className="edit-button" onClick={() => handleEditItem(item)}>Izmeni</button>
                                            <button className="delete-button" onClick={() => handleDeleteItem(item.id)}>Obriši</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        ))}
                    </div>

                    {showAddModal && (
                        <div className="modal-overlay" onClick={() => setShowAddModal(false)}>
                            <div className="modal-content" onClick={e => e.stopPropagation()}>
                                <button className="modal-close" onClick={() => setShowAddModal(false)}>✕</button>
                                <h2 className="modal-title">Dodaj Novi Artikal</h2>
                                
                                <div className="form-group">
                                    <label className="form-label">Naziv (Srpski)</label>
                                    <input 
                                        className="form-input"
                                        value={newItem.name.sr}
                                        onChange={(e) => setNewItem({
                                            ...newItem,
                                            name: { ...newItem.name, sr: e.target.value }
                                        })}
                                        placeholder="Espresso"
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Name (English)</label>
                                    <input 
                                        className="form-input"
                                        value={newItem.name.en}
                                        onChange={(e) => setNewItem({
                                            ...newItem,
                                            name: { ...newItem.name, en: e.target.value }
                                        })}
                                        placeholder="Espresso"
                                    />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Cena (RSD)</label>
                                    <input 
                                        className="form-input"
                                        type="number"
                                        value={newItem.price}
                                        onChange={(e) => setNewItem({
                                            ...newItem,
                                            price: e.target.value
                                        })}
                                        placeholder="150"
                                    />
                                </div>

                                <button className="submit-button" onClick={handleAddItem}>
                                    Dodaj Artikal
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
